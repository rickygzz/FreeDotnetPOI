version: 2
updates:
  # GitHub Actions are not listed here: .github/workflows/CI.yml and PR.yml are generated by NUKE
  # from build/Build.GitHubAction.cs, so action versions are updated there, not in the YAML.

  # NuGet: security updates only (no routine version bumps).
  # Never take NPOI 2.8+ (no longer free) or Six Labors packages (replaced by FreeDotnetImageSharp
  # and FreeDotnetFonts; SixLabors.ImageSharp 3.0+ and SixLabors.Fonts 2.0+ use the Split License).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "SixLabors.*"
      - dependency-name: "NPOI"
